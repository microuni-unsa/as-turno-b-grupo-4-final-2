# ==============================================================================
# Turno B Grupo 4: Agentic Incidents-PIMS for UNSA - Docker Compose
# ==============================================================================
# Topology & Architecture (2-Container Stack: agent + db):
#   - agent : UNSA PIMS Operator + Unified Web App (Bun/React SPA on port 8082,
#             with native chat, file uploads/downloads, and age-encrypted secrets)
#   - db    : PostgreSQL 16 + pgvector mirror & secrets_registry
#
# 1. Traefik Hosting Model:
#    - Host provides Traefik and docker-proxy on the external network 'internal-proxy'.
#    - Do NOT run a separate Traefik instance in this compose file.
#
# 2. Sibling Container Labels Convention (SPEC §4.1):
#    Every service or deliverable spawned by the agent under <slug> must:
#      - Join network: 'internal-proxy'
#      - Configure labels:
#          traefik.enable=true
#          traefik.docker.network=internal-proxy
#          traefik.http.routers.pimsai-<slug>.rule=Host(`<slug>.pimsai.mistercricro8.top`)
#          traefik.http.routers.pimsai-<slug>.entrypoints=https
#          traefik.http.routers.pimsai-<slug>.tls=true
#          traefik.http.routers.pimsai-<slug>.tls.certresolver=cloudflare
#          traefik.http.services.pimsai-<slug>.loadbalancer.server.port=<port>
#
# 3. Reserved Slugs (2-Container Topology):
#    The following slug is strictly RESERVED and MUST NOT be claimed by any
#    agent-spawned deliverable or generated service:
#      - 'demo' : Unified UNSA PIMS Web App (port 8082; handles chat, file uploads/
#                 downloads, and age-encrypted secrets natively — 'files' and
#                 'secrets' sidecars are retired)
#
# 4. Cloudflare & Port 444 Routing Edge Case (SPEC §4.1, §13):
#    - The Cloudflare wildcard rule maps external 443 -> 444 on the VPS.
#    - Traefik's 'https' entrypoint listens on port 444.
#    - Diagnostics fallback: If 'https://<slug>.pimsai.mistercricro8.top' fails,
#      check Cloudflare proxy rules first. Direct connection fallback is:
#      https://<slug>.pimsai.mistercricro8.top:444
# ==============================================================================

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pimsai-agent
    restart: unless-stopped
    init: true
    # Staging-copy topology (P3.8): compose runs with cwd=<staging>/ (see scripts/deploy-sync.sh),
    # so `.:/app` binds the disposable staging copy, never the pristine repo. Secrets come
    # from the host-level .env OUTSIDE both dirs (PIMSAI_ENV_FILE), never bind-mounted.
    env_file:
      - ${PIMSAI_ENV_FILE:-.env}
    command:
      - bash
      - -lc
      - |
        if [ -n "$${AGENT_ENV_VAR:-}" ] && [ -n "$${AGENT_API_KEY:-}" ]; then
          export "$${AGENT_ENV_VAR}=$${AGENT_API_KEY}"
        fi
        MEMDIR=/home/agent/.omp/agent/memories/--app--
        if [ -f /app/.omp/memory-seed/memory_summary.md ]; then
          mkdir -p "$${MEMDIR}"
          if ! cmp -s /app/.omp/memory-seed/memory_summary.md "$${MEMDIR}/memory_summary.md" 2>/dev/null; then
            cp /app/.omp/memory-seed/memory_summary.md "$${MEMDIR}/memory_summary.md"
            echo "[memory-seed] seeded current memory_summary.md"
          fi
        fi
        bun scripts/pims.ts mirror sync --loop --interval 300 > /tmp/pims-mirror-sync.log 2>&1 &
        exec bun /app/apps/web/server/index.ts
    environment:
      # Docker API connectivity:
      # Default connects to host docker-proxy on internal-proxy network (SPEC §4)
      - DOCKER_HOST=${DOCKER_HOST:-tcp://docker-proxy:2375}

      # Database connection (pgvector sidecar)
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-pims_agent}}

      # PIMS Tenant & Authentication
      - PIMS_BASE_URL=${PIMS_BASE_URL:-https://unsa.27k.pe}
      - PIMS_USERNAME=${PIMS_USERNAME:?PIMS_USERNAME must be set in .env}
      - PIMS_PASSWORD=${PIMS_PASSWORD:?PIMS_PASSWORD must be set in .env}
      - PIMS_TENANT_SCHEMA=${PIMS_TENANT_SCHEMA:-unsa}
      - PIMS_CODE_PREFIX=${PIMS_CODE_PREFIX:-G4-}

      # Embeddings & LLM Models
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY:?EMBEDDINGS_API_KEY must be set in .env}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL:?EMBEDDINGS_BASE_URL must be set in .env}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:?EMBEDDING_MODEL must be set in .env}
      - AGENT_ENV_VAR=${AGENT_ENV_VAR:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_MODEL=${AGENT_MODEL:-opencode-go/muse-spark-1.3-contributor}

      # Unified Web App (Auth, Dist, Uploads & Runtime Customization)
      - WEB_PORT=${WEB_PORT:-8082}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://demo.pimsai.mistercricro8.top:444}
      - WEB_INTERNAL_URL=http://127.0.0.1:8082
      - WEB_DIST_DIR=/opt/pimsai-web/dist
      - WEB_RW_TOKEN=${WEB_RW_TOKEN:?WEB_RW_TOKEN must be set in .env}
      - WEB_RO_TOKEN=${WEB_RO_TOKEN:-}
      - WEB_APP_NAME=${WEB_APP_NAME:-}
      - WEB_APP_SUBTITLE=${WEB_APP_SUBTITLE:-}
      - WEB_PRIMARY_COLOR=${WEB_PRIMARY_COLOR:-}
      - WEB_ACCENT_COLOR=${WEB_ACCENT_COLOR:-}
      - WEB_DEFAULT_THEME=${WEB_DEFAULT_THEME:-}
      - UPLOADS_DIR=/app/data/preserved_uploads

      # Secrets store configuration (age-encrypted storage)
      - SECRETS_STORE_PATH=/app/secrets

      # Runtime Corpus Mirror outside bind-mounted /app
      - CORPUS_MIRROR_DIR=${CORPUS_MIRROR_DIR:-/var/lib/pimsai/corpus_mirror}

      # Outbound Gmail SMTP configuration for summons & notifications
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Mail drafts store on the persistent agent_data volume (survives restarts)
      - MAIL_DRAFTS_PATH=${MAIL_DRAFTS_PATH:-/home/agent/.pims-mail-drafts.json}

      # Domain root & runtime flags
      - DOMAIN_ROOT=${DOMAIN_ROOT:-pimsai.mistercricro8.top}
      - PI_SKIP_VERSION_CHECK=1
    volumes:
      # Persistent storage for agent state, cache, and omp configuration
      - agent_data:/home/agent
      # Age-encrypted secrets store path
      - secrets_data:/app/secrets
      # Synced PIMS corpus mirror persisted outside /app bind-mount
      - corpus_mirror_data:/var/lib/pimsai/corpus_mirror
      # Application workspace
      - .:/app
      # Preserved user uploads & published deliverables
      - uploads_data:/app/data/preserved_uploads
    networks:
      - internal-proxy
      - agent-internal
    labels:
      # Traefik routing for reserved 'demo' slug (Unified UNSA PIMS Web App)
      - "traefik.enable=true"
      - "traefik.docker.network=internal-proxy"
      - "traefik.http.routers.pimsai-demo.rule=Host(`demo.pimsai.mistercricro8.top`)"
      - "traefik.http.routers.pimsai-demo.entrypoints=https"
      - "traefik.http.routers.pimsai-demo.tls=true"
      - "traefik.http.routers.pimsai-demo.tls.certresolver=cloudflare"
      - "traefik.http.services.pimsai-demo.loadbalancer.server.port=8082"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: pimsai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pims_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      # Persistent vector database storage
      - pgvector_data:/var/lib/postgresql/data
      # Initialize rag-mirror and secrets_registry tables on first boot
      - ./packages/rag-mirror/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - agent-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-pims_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Host-provided external network hosting Traefik and docker-proxy (SPEC §4)
  internal-proxy:
    external: true
  # Isolated bridge network between agent and db
  agent-internal:
    driver: bridge

volumes:
  agent_data:
    driver: local
  secrets_data:
    driver: local
  corpus_mirror_data:
    driver: local
  pgvector_data:
    driver: local
  uploads_data:
    driver: local
