# ==============================================================================
# Turno B Grupo 4: Agentic Incidents-PIMS for UNSA - Docker Compose
# ==============================================================================
# Topology & Architecture Normative Reference: docs/SPEC.md (§4, §4.1, §4.2, §4.3)
#
# 1. Traefik Hosting Model:
#    - Host provides Traefik and docker-proxy on the external network 'internal-proxy'.
#    - Do NOT run a separate Traefik instance in this compose file.
#
# 2. Sibling Container Labels Convention (SPEC §4.1):
#    Every service or deliverable spawned by the agent under <slug> must:
#      - Join network: 'internal-proxy'
#      - Configure labels:
#          traefik.enable=true
#          traefik.docker.network=internal-proxy
#          traefik.http.routers.pimsai-<slug>.rule=Host(`<slug>.pimsai.mistercricro8.top`)
#          traefik.http.routers.pimsai-<slug>.entrypoints=https
#          traefik.http.routers.pimsai-<slug>.tls=true
#          traefik.http.routers.pimsai-<slug>.tls.certresolver=cloudflare
#          traefik.http.services.pimsai-<slug>.loadbalancer.server.port=<port>
#
# 3. Reserved Slugs (SPEC §4.1):
#    The following slugs are strictly RESERVED and MUST NOT be claimed by any
#    agent-spawned deliverable or generated service:
#      - 'demo'    : Zellij web instructor terminal (port 8082, SPEC §4.2)
#      - 'files'   : Ephemeral document upload sidecar (port 3000, SPEC §9.3)
#      - 'secrets' : Age-encrypted secrets injection sidecar (port 3000, SPEC §4.3)
#
# 4. Cloudflare & Port 444 Routing Edge Case (SPEC §4.1, §13):
#    - The Cloudflare wildcard rule maps external 443 -> 444 on the VPS.
#    - Traefik's 'https' entrypoint listens on port 444.
#    - Diagnostics fallback: If 'https://<slug>.pimsai.mistercricro8.top' fails,
#      check Cloudflare proxy rules first. Direct connection fallback is:
#      https://<slug>.pimsai.mistercricro8.top:444
# ==============================================================================

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pimsai-agent
    restart: unless-stopped
    command:
      - bash
      - -lc
      - |
        if [ -n "$${AGENT_ENV_VAR:-}" ] && [ -n "$${AGENT_API_KEY:-}" ]; then
          export "$${AGENT_ENV_VAR}=$${AGENT_API_KEY}"
        fi
        mkdir -p /home/agent/.config/zellij
        if [ ! -f /home/agent/.config/zellij/config.kdl ]; then
          zellij setup --dump-config > /home/agent/.config/zellij/config.kdl
        fi
        if ! grep -q '^web_sharing "on"' /home/agent/.config/zellij/config.kdl; then
          printf '\nweb_sharing "on"\n' >> /home/agent/.config/zellij/config.kdl
        fi
        if ! grep -q '^default_mode "locked"' /home/agent/.config/zellij/config.kdl; then
          printf '\ndefault_mode "locked"\n' >> /home/agent/.config/zellij/config.kdl
        fi
        rm -f /home/agent/.config/zellij/layouts/default.kdl
        (bun run /app/scripts/sync-pims-truth.ts --loop --interval 300 || echo "[sync-loop] loop exited") &
        zellij web --ip 127.0.0.1 --port 8083 -d
        if [ -n "$${AGENT_MODEL:-}" ]; then
          zellij attach -b pimsai -- omp --model "$${AGENT_MODEL}" || true
        else
          zellij attach -b pimsai -- omp || true
        fi
        exec bun -e '
          import net from "node:net";
          net.createServer((client) => {
            const target = net.connect(8083, "127.0.0.1");
            client.pipe(target);
            target.pipe(client);
            client.on("error", () => target.destroy());
            target.on("error", () => client.destroy());
          }).listen(8082, "0.0.0.0");
        '
    environment:
      # Docker API connectivity:
      # Default connects to host docker-proxy on internal-proxy network (SPEC §4)
      - DOCKER_HOST=${DOCKER_HOST:-tcp://docker-proxy:2375}

      # Database connection (pgvector sidecar)
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-pims_agent}}

      # PIMS Tenant & Authentication
      - PIMS_BASE_URL=${PIMS_BASE_URL:-https://unsa.27k.pe}
      - PIMS_USERNAME=${PIMS_USERNAME:?PIMS_USERNAME must be set in .env}
      - PIMS_PASSWORD=${PIMS_PASSWORD:?PIMS_PASSWORD must be set in .env}
      - PIMS_TENANT_SCHEMA=${PIMS_TENANT_SCHEMA:-unsa}
      - PIMS_CODE_PREFIX=${PIMS_CODE_PREFIX:-G4-}

      # Embeddings & LLM Models
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY:?EMBEDDINGS_API_KEY must be set in .env}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL:?EMBEDDINGS_BASE_URL must be set in .env}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:?EMBEDDING_MODEL must be set in .env}
      - AGENT_ENV_VAR=${AGENT_ENV_VAR:-}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_MODEL=${AGENT_MODEL:-opencode-go/muse-spark-1.3-contributor}

      # Secrets store configuration (SPEC §4.3)
      - SECRETS_STORE_PATH=/app/secrets

      # Domain root & runtime flags
      - DOMAIN_ROOT=${DOMAIN_ROOT:-pimsai.mistercricro8.top}
      - PI_SKIP_VERSION_CHECK=1
    volumes:
      # Persistent storage for agent state, cache, and omp configuration
      - agent_data:/home/agent
      # Secrets store path (SPEC §4.3)
      - secrets_data:/app/secrets
      # Application workspace
      - .:/app
      # Shared uploaded files from files-sidecar
      - uploads_data:/app/data/preserved_uploads
    networks:
      - internal-proxy
      - agent-internal
    labels:
      # Traefik routing for reserved 'demo' slug (Zellij Web instructor interface, SPEC §4.2)
      - "traefik.enable=true"
      - "traefik.docker.network=internal-proxy"
      - "traefik.http.routers.pimsai-demo.rule=Host(`demo.pimsai.mistercricro8.top`)"
      - "traefik.http.routers.pimsai-demo.entrypoints=https"
      - "traefik.http.routers.pimsai-demo.tls=true"
      - "traefik.http.routers.pimsai-demo.tls.certresolver=cloudflare"
      - "traefik.http.services.pimsai-demo.loadbalancer.server.port=8082"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: pimsai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pims_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      # Persistent vector database storage
      - pgvector_data:/var/lib/postgresql/data
      # Initialize rag-mirror and secrets_registry tables on first boot
      - ./packages/rag-mirror/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - agent-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-pims_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  files-sidecar:
    build:
      context: ./services/files-sidecar
      dockerfile: Dockerfile
    container_name: pimsai-files-sidecar
    restart: unless-stopped
    environment:
      - PORT=3000
      - PUBLIC_BASE_URL=${FILES_BASE_URL:-https://files.pimsai.mistercricro8.top:444}
      - PIMS_BASE_URL=${PIMS_BASE_URL:-https://unsa.27k.pe}
      - PIMS_TENANT_SCHEMA=${PIMS_TENANT_SCHEMA:-unsa}
      - PIMS_JWT_TOKEN=${PIMS_JWT_TOKEN:-}
      - PIMS_USERNAME=${PIMS_USERNAME:-}
      - PIMS_PASSWORD=${PIMS_PASSWORD:-}
    volumes:
      - uploads_data:/app/data/preserved_uploads
    networks:
      - internal-proxy
    labels:
      # Traefik routing for reserved 'files' slug (Upload sidecar, SPEC §4.1, §9.3)
      - "traefik.enable=true"
      - "traefik.docker.network=internal-proxy"
      - "traefik.http.routers.pimsai-files.rule=Host(`files.pimsai.mistercricro8.top`)"
      - "traefik.http.routers.pimsai-files.entrypoints=https"
      - "traefik.http.routers.pimsai-files.tls=true"
      - "traefik.http.routers.pimsai-files.tls.certresolver=cloudflare"
      - "traefik.http.services.pimsai-files.loadbalancer.server.port=3000"

  secrets-sidecar:
    build:
      context: ./services/secrets-sidecar
      dockerfile: Dockerfile
    container_name: pimsai-secrets-sidecar
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - BASE_URL=${SECRETS_BASE_URL:-https://secrets.pimsai.mistercricro8.top:444}
      - SECRETS_STORE_DIR=/var/lib/secrets-store
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-pims_agent}}
    volumes:
      # Persistent secrets store (shared age-encrypted volume)
      - secrets_data:/var/lib/secrets-store
    networks:
      - internal-proxy
      - agent-internal
    labels:
      # Traefik routing for reserved 'secrets' slug (Secrets injection sidecar, SPEC §4.1, §4.3)
      - "traefik.enable=true"
      - "traefik.docker.network=internal-proxy"
      - "traefik.http.routers.pimsai-secrets.rule=Host(`secrets.pimsai.mistercricro8.top`)"
      - "traefik.http.routers.pimsai-secrets.entrypoints=https"
      - "traefik.http.routers.pimsai-secrets.tls=true"
      - "traefik.http.routers.pimsai-secrets.tls.certresolver=cloudflare"
      - "traefik.http.services.pimsai-secrets.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy

networks:
  # Host-provided external network hosting Traefik and docker-proxy (SPEC §4)
  internal-proxy:
    external: true
  # Isolated bridge network between agent, db, and secrets-sidecar
  agent-internal:
    driver: bridge

volumes:
  agent_data:
    driver: local
  secrets_data:
    driver: local
  pgvector_data:
    driver: local
  uploads_data:
    driver: local
